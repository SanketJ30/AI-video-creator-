      o2:
        extracted: [o2]
        verdict: covered
        comment: >-
          NEWLY COVERED — this is the entry's whole point. Extracted o2's
          criterion reads "distinguishing write skew from the dirty read,
          non-repeatable read and phantom read that Repeatable Read does
          prevent". All three names gold o2 asked for, in the right polarity:
