# Local dev: one command, everything up (PRD §16 Phase 1, item 8).
# Production render compute stays local through Phase 8 — do not build render
# infrastructure before you have something worth rendering at volume (D12).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: explainer
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d explainer"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Optional: S3-compatible store for exercising the s3 backend locally.
  # With ARTIFACT_BACKEND=local you do not need this at all.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
