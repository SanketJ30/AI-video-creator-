[project]
name = "explainer-pipeline"
version = "0.1.0"
description = "AI-native explainer video pipeline (PRD v4) — Phase 1 skeleton"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
explainer = "explainer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: makes a real, billed model call; skipped without ANTHROPIC_API_KEY",
]

[tool.ruff]
line-length = 100
target-version = "py311"
